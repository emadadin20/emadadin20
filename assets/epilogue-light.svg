<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 270" width="1280" height="270" role="img" aria-label="Epilogue — Let's Build Something Remarkable Together" fill="none">
    <title>Epilogue — Let's Build Something Remarkable Together</title>
    
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
      .fi { animation: fadeIn 1.2s ease both; }
      .fu { animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .pg { animation: pulseGlow 3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .serif { font-family: 'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: 'Cairo', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .gold-grad { fill: url(#goldGrad); }
      .gold-stroke { stroke: url(#goldGrad); }
    </style>
    
    
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#D4AF37"/>
        <stop offset="50%" stop-color="#9A7228"/>
        <stop offset="100%" stop-color="#785314"/>
      </linearGradient>
      <linearGradient id="goldHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#785314" stop-opacity="0.1"/>
        <stop offset="30%" stop-color="#9A7228" stop-opacity="0.8"/>
        <stop offset="70%" stop-color="#D4AF37"/>
        <stop offset="100%" stop-color="#785314" stop-opacity="0.1"/>
      </linearGradient>
      <radialGradient id="ambientGlow" cx="50%" cy="0%" r="70%">
        <stop offset="0%" stop-color="#9A7228" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#9A7228" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="avatarClip">
        <circle cx="250" cy="245" r="95"/>
      </clipPath>
    </defs>
    
    <rect width="1280" height="270" fill="#FAF6ED"/>
    
    <g class="fu">
      <rect x="50" y="20" width="1180" height="230" rx="16" fill="#FFFFFF" stroke="rgba(154, 114, 40, 0.35)" stroke-width="1.2"/>
      <rect x="58" y="28" width="1164" height="214" rx="12" fill="none" stroke="rgba(154, 114, 40, 0.18)" stroke-width="0.8"/>
      
      <!-- Top Crest -->
      <text x="640" y="55" text-anchor="middle" class="serif" font-size="12" letter-spacing="4" fill="#9A7228">✦ · ❖ · ✦</text>
      
      <!-- Main Callout -->
      <text x="640" y="95" text-anchor="middle" class="serif" font-size="32" font-weight="700" fill="#1E1912">Let's Build Something Remarkable Together</text>
      <text x="640" y="125" text-anchor="middle" class="sans" font-size="14.5" fill="#635B4F">Open for Enterprise Systems Architecture · Bespoke Autonomous AI &amp; RAG · High-Integrity Engineering</text>
      
      <!-- 3 Interactive / Callout Badges -->
      <g transform="translate(190, 155)">
        <!-- Email -->
        <rect x="0" y="0" width="280" height="42" rx="8" fill="rgba(154, 114, 40, 0.08)" stroke="rgba(154, 114, 40, 0.35)" stroke-width="1"/>
        <text x="140" y="26" text-anchor="middle" class="mono" font-size="11.5" letter-spacing="1" fill="#1E1912">✉️ emadadin17@gmail.com</text>
        
        <!-- WhatsApp -->
        <rect x="310" y="0" width="280" height="42" rx="8" fill="rgba(154, 114, 40, 0.08)" stroke="rgba(154, 114, 40, 0.35)" stroke-width="1"/>
        <text x="450" y="26" text-anchor="middle" class="mono" font-size="11.5" letter-spacing="1" fill="#1E1912">💬 WhatsApp: +967 773774428</text>

        <!-- GitHub -->
        <rect x="620" y="0" width="280" height="42" rx="8" fill="rgba(154, 114, 40, 0.08)" stroke="rgba(154, 114, 40, 0.35)" stroke-width="1"/>
        <text x="760" y="26" text-anchor="middle" class="mono" font-size="11.5" letter-spacing="1" fill="#1E1912">⚡ GitHub: @emadadin20</text>
      </g>
      
      <!-- Bottom Fine Caption -->
      <text x="640" y="228" text-anchor="middle" class="mono" font-size="10" letter-spacing="3" fill="#9A7228">SANA'A, YEMEN · ASAAS SYSTEMS &amp; AI · PRODUCTION ARCHITECTURE</text>
    </g>
</svg>