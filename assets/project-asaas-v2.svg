<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="p-title">
  <title id="p-title">ASAAS Platform Ecosystem: Next-generation business ERP suite with AI copilot and automated multi-tenant workflows.</title>
  <defs>
    <linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="p-glow" cx="82%" cy="30%" r="55%"><stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <pattern id="p-grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/></pattern>
    <filter id="p-glowf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="p-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="p-trace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .p1-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .p1-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p1-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .p1-in { animation: p1-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .p1-chip { animation: p1-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes p1-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .p1-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: p1-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes p1-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes p1-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-in, .p1-chip { animation: none; } .p1-draw { animation: none; stroke-dashoffset: 0; } }
    .p1-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: p1-trace 7s linear infinite; }
    @keyframes p1-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .p1-trace { display: none; } }
  </style>
  <g clip-path="url(#p-clip)">
    <rect width="1200" height="370" fill="url(#p-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#p-grid)"/>
    <rect width="1200" height="370" fill="url(#p-glow)"/>
    <g class="p1-in">
      <text class="p1-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">01 · ENTERPRISE ERP · MULTI-TENANT · 2026</text>
      <text class="p1-serif" x="54" y="126" font-size="50" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">ASAAS Platform Ecosystem</text>
      <text class="p1-sans" x="56" y="166" font-size="16.5" fill="#B6A3AC">Next-generation business ERP suite with AI copilot and automated multi-tenant workflows.</text>
      <text class="p1-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Estates, Cars & IT Tracker ERP modules, tenant isolation, dynamic reporting</text>
      <line class="p1-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">12+</text><text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">enterprise modules built</text></g>
      <g transform="translate(261 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">99.9%</text><text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">system availability</text></g>
      <g transform="translate(466 266)"><text class="p1-serif" font-size="34" font-weight="300" fill="#F8F0F3">10x</text><text class="p1-sans" y="24" font-size="12.5" fill="#B6A3AC">faster business workflows</text></g>
      <g class="p1-chip" style="animation-delay:1.00s">
          <rect x="56" y="314" width="75.0" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/>
          <text class="p1-mono" x="93.5" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Python</text>
        </g><g class="p1-chip" style="animation-delay:1.12s">
          <rect x="141.0" y="314" width="83.5" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/>
          <text class="p1-mono" x="182.8" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">FastAPI</text>
        </g><g class="p1-chip" style="animation-delay:1.24s">
          <rect x="234.5" y="314" width="66.5" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/>
          <text class="p1-mono" x="267.8" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">React</text>
        </g><g class="p1-chip" style="animation-delay:1.36s">
          <rect x="311.0" y="314" width="109.0" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/>
          <text class="p1-mono" x="365.5" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">TypeScript</text>
        </g><g class="p1-chip" style="animation-delay:1.48s">
          <rect x="430.0" y="314" width="109.0" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/>
          <text class="p1-mono" x="484.5" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">PostgreSQL</text>
        </g><g class="p1-chip" style="animation-delay:1.60s">
          <rect x="549.0" y="314" width="75.0" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/>
          <text class="p1-mono" x="586.5" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Docker</text>
        </g><g class="p1-chip" style="animation-delay:1.72s">
          <rect x="634.0" y="314" width="126.0" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/>
          <text class="p1-mono" x="697.0" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Multi-Tenant</text>
        </g>
    </g>
    <!-- Right side decorative architecture schema -->
    <g transform="translate(820 50)">
      <rect width="320" height="260" rx="14" fill="#190B12" stroke="#C77B9B" stroke-opacity=".35"/>
      <rect x="20" y="20" width="280" height="48" rx="8" fill="#27101C" stroke="#701A3D" stroke-opacity=".5"/>
      <text class="p1-mono" x="160" y="48" text-anchor="middle" font-size="11.5" fill="#F8F0F3">INTELLIGENT AGENT RUNTIME</text>
      <path d="M160 68 V105" stroke="#C77B9B" stroke-opacity=".5" stroke-dasharray="2 3"/>
      <rect x="20" y="105" width="130" height="48" rx="8" fill="#27101C" stroke="#701A3D" stroke-opacity=".5"/>
      <text class="p1-mono" x="85" y="133" text-anchor="middle" font-size="11" fill="#E5B5C7">RAG ENGINE</text>
      <rect x="170" y="105" width="130" height="48" rx="8" fill="#27101C" stroke="#701A3D" stroke-opacity=".5"/>
      <text class="p1-mono" x="235" y="133" text-anchor="middle" font-size="11" fill="#E5B5C7">ERP CORE</text>
      <path d="M85 153 V190 M235 153 V190" stroke="#C77B9B" stroke-opacity=".5" stroke-dasharray="2 3"/>
      <rect x="20" y="190" width="280" height="48" rx="8" fill="#27101C" stroke="#701A3D" stroke-opacity=".5"/>
      <text class="p1-mono" x="160" y="218" text-anchor="middle" font-size="11" fill="#F8F0F3">POSTGRESQL · ACID COMPLIANCE</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="p1-trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#p-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>