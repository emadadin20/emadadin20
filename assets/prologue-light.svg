<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="Prologue — Architectural Philosophy &amp; Impact" fill="none">
    <title>Prologue — Architectural Philosophy &amp; Impact</title>
    
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
      .fi { animation: fadeIn 1.2s ease both; }
      .fu { animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .pg { animation: pulseGlow 3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .serif { font-family: 'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: 'Cairo', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .gold-grad { fill: url(#goldGrad); }
      .gold-stroke { stroke: url(#goldGrad); }
    </style>
    
    
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#D4AF37"/>
        <stop offset="50%" stop-color="#9A7228"/>
        <stop offset="100%" stop-color="#785314"/>
      </linearGradient>
      <linearGradient id="goldHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#785314" stop-opacity="0.1"/>
        <stop offset="30%" stop-color="#9A7228" stop-opacity="0.8"/>
        <stop offset="70%" stop-color="#D4AF37"/>
        <stop offset="100%" stop-color="#785314" stop-opacity="0.1"/>
      </linearGradient>
      <radialGradient id="ambientGlow" cx="50%" cy="0%" r="70%">
        <stop offset="0%" stop-color="#9A7228" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#9A7228" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="avatarClip">
        <circle cx="250" cy="245" r="95"/>
      </clipPath>
    </defs>
    
    <rect width="1280" height="480" fill="#FAF6ED"/>
    
    <!-- TOP ARCHITECTURAL STATEMENT CARD -->
    <g class="fu">
      <rect x="50" y="20" width="1180" height="175" rx="14" fill="#FFFFFF" stroke="rgba(154, 114, 40, 0.35)" stroke-width="1.2"/>
      <rect x="50" y="20" width="6" height="175" rx="3" fill="url(#goldGrad)"/>
      
      <text x="80" y="55" class="mono" font-size="11" letter-spacing="3" fill="#9A7228">SOVEREIGN ARCHITECTURAL MANIFESTO</text>
      <text x="80" y="90" class="serif" font-size="20" font-weight="600" fill="#1E1912">"Software architecture is the art of structuring durable, mathematically sound institutions."</text>
      
      <text x="80" y="125" class="sans" font-size="14.5" fill="#635B4F">Rooted in rigorous mathematical foundations at IUTT University (Statistics, Probability, Linear Algebra) and low-level systems engineering (8086 Assembly, C++, Java),</text>
      <text x="80" y="150" class="sans" font-size="14.5" fill="#635B4F">I architect mission-critical enterprise platforms with absolute ACID financial integrity, sub-second latency, and autonomous RAG agent swarms.</text>
      
      <text x="1190" y="170" text-anchor="end" class="mono" font-size="11" letter-spacing="2" fill="#9A7228">ENG. EMAD'ADIN AL-YNAEY</text>
    </g>

    <!-- BOTTOM 4 KPI IMPACT CARDS -->
    <g class="fu" style="animation-delay: 0.25s;">
      <!-- Card 1 -->
      <g transform="translate(50, 220)">
        <rect width="275" height="230" rx="12" fill="#FFFFFF" stroke="rgba(154, 114, 40, 0.35)" stroke-width="1"/>
        <rect x="20" y="20" width="36" height="4" rx="2" fill="#9A7228"/>
        <text x="20" y="75" class="serif" font-size="44" font-weight="700" fill="url(#goldGrad)">35+</text>
        <text x="20" y="105" class="mono" font-size="12" letter-spacing="2" font-weight="600" fill="#1E1912">ENTERPRISE MODULES</text>
        <text x="20" y="140" class="sans" font-size="13.5" fill="#635B4F">Full-cycle ERPs for real estate,</text>
        <text x="20" y="162" class="sans" font-size="13.5" fill="#635B4F">automotive showrooms, and</text>
        <text x="20" y="184" class="sans" font-size="13.5" fill="#635B4F">campus IT asset tracking.</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(350, 220)">
        <rect width="275" height="230" rx="12" fill="#FFFFFF" stroke="rgba(154, 114, 40, 0.35)" stroke-width="1"/>
        <rect x="20" y="20" width="36" height="4" rx="2" fill="#9A7228"/>
        <text x="20" y="75" class="serif" font-size="44" font-weight="700" fill="url(#goldGrad)">50+</text>
        <text x="20" y="105" class="mono" font-size="12" letter-spacing="2" font-weight="600" fill="#1E1912">MINDS MENTORED</text>
        <text x="20" y="140" class="sans" font-size="13.5" fill="#635B4F">Tutored in Math &amp; English with</text>
        <text x="20" y="162" class="sans" font-size="13.5" fill="#635B4F">95% satisfaction rate and</text>
        <text x="20" y="184" class="sans" font-size="13.5" fill="#635B4F">+20% academic improvement.</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(650, 220)">
        <rect width="275" height="230" rx="12" fill="#FFFFFF" stroke="rgba(154, 114, 40, 0.35)" stroke-width="1"/>
        <rect x="20" y="20" width="36" height="4" rx="2" fill="#9A7228"/>
        <text x="20" y="75" class="serif" font-size="44" font-weight="700" fill="url(#goldGrad)">99.9%</text>
        <text x="20" y="105" class="mono" font-size="12" letter-spacing="2" font-weight="600" fill="#1E1912">FINANCIAL INTEGRITY</text>
        <text x="20" y="140" class="sans" font-size="13.5" fill="#635B4F">Strict ACID transaction locks,</text>
        <text x="20" y="162" class="sans" font-size="13.5" fill="#635B4F">immutable system audit logs,</text>
        <text x="20" y="184" class="sans" font-size="13.5" fill="#635B4F">and multi-currency ledgers.</text>
      </g>

      <!-- Card 4 -->
      <g transform="translate(950, 220)">
        <rect width="280" height="230" rx="12" fill="#FFFFFF" stroke="rgba(154, 114, 40, 0.35)" stroke-width="1"/>
        <rect x="20" y="20" width="36" height="4" rx="2" fill="#9A7228"/>
        <text x="20" y="75" class="serif" font-size="44" font-weight="700" fill="url(#goldGrad)">AI &amp; DS</text>
        <text x="20" y="105" class="mono" font-size="12" letter-spacing="2" font-weight="600" fill="#1E1912">IUTT UNIVERSITY</text>
        <text x="20" y="140" class="sans" font-size="13.5" fill="#635B4F">Theoretical &amp; applied mastery:</text>
        <text x="20" y="162" class="sans" font-size="13.5" fill="#635B4F">Probability, Statistics, Algebra,</text>
        <text x="20" y="184" class="sans" font-size="13.5" fill="#635B4F">and modern neural systems.</text>
      </g>
    </g>
</svg>