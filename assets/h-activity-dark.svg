<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="1280" height="190" role="img" aria-label="III. Activity" fill="none"><title>III. Activity</title><style>@font-face{font-family:'Amono';src:url(data:font/woff2;base64,) format('woff2');font-display:block;}@font-face{font-family:'AserifI';src:url(data:font/woff2;base64,) format('woff2');font-display:block;}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
@keyframes fillIn{from{fill-opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(0)}}
.d{stroke-dasharray:1;animation:draw var(--t,2.4s) cubic-bezier(.65,0,.35,1) var(--d,0s) both}
.fi{animation:fadeIn var(--t,1.2s) ease var(--d,0s) both}
.fu{animation:fadeUp var(--t,1.2s) cubic-bezier(.2,.7,.2,1) var(--d,0s) both}
.gr{transform-box:fill-box;transform-origin:var(--o,left center);animation:grow var(--t,1.6s) cubic-bezier(.65,0,.35,1) var(--d,0s) both}
.gy{transform-box:fill-box;transform-origin:center top;animation:growY var(--t,1.6s) cubic-bezier(.65,0,.35,1) var(--d,0s) both}
.pp{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) var(--d,0s) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><text class="fu" x="640.0" y="52" text-anchor="middle" font-family="'Amono', 'JetBrains Mono', ui-monospace, monospace" font-size="12" letter-spacing="6" fill="#F4F3EF" fill-opacity=".5">— III —</text><text class="fu" style="--d:.25s;--t:1.6s" x="640.0" y="118" text-anchor="middle" font-family="'AserifI', 'Cormorant Garamond', Georgia, serif" font-size="58" fill="#F4F3EF">Activity</text><path class="gr" style="--o:right center;--d:.6s" d="M406.07399999999996 100H520.074" stroke="#F4F3EF" stroke-opacity=".45" stroke-width=".8"/><path class="gr" style="--d:.6s" d="M759.926 100H873.926" stroke="#F4F3EF" stroke-opacity=".45" stroke-width=".8"/><rect class="pp" style="--d:1.6s" x="398.07399999999996" y="96" width="5.6" height="5.6" transform="rotate(45 400.87399999999997 98.8)" fill="#F4F3EF"/><rect class="pp" style="--d:1.6s" x="876.326" y="96" width="5.6" height="5.6" transform="rotate(45 879.126 98.8)" fill="#F4F3EF"/><text class="fi" style="--d:1s" x="640.0" y="160" text-anchor="middle" font-family="'Amono', 'JetBrains Mono', ui-monospace, monospace" font-size="11" letter-spacing="4.4" fill="#F4F3EF" fill-opacity=".45">THE RHYTHM OF THE WORK</text></svg>