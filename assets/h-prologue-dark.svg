<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 180" width="1280" height="180" role="img" aria-label="I. Prologue" fill="none">
    <title>I. Prologue</title>
    
    <style>
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
      .fi { animation: fadeIn 1.2s ease both; }
      .fu { animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
      .pg { animation: pulseGlow 3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
      .serif { font-family: 'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: 'Cairo', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .gold-grad { fill: url(#goldGrad); }
      .gold-stroke { stroke: url(#goldGrad); }
    </style>
    
    
    <defs>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F3D78F"/>
        <stop offset="50%" stop-color="#C5A059"/>
        <stop offset="100%" stop-color="#9A7228"/>
      </linearGradient>
      <linearGradient id="goldHorizontal" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#9A7228" stop-opacity="0.1"/>
        <stop offset="30%" stop-color="#C5A059" stop-opacity="0.8"/>
        <stop offset="70%" stop-color="#F3D78F"/>
        <stop offset="100%" stop-color="#9A7228" stop-opacity="0.1"/>
      </linearGradient>
      <radialGradient id="ambientGlow" cx="50%" cy="0%" r="70%">
        <stop offset="0%" stop-color="#C5A059" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="avatarClip">
        <circle cx="250" cy="245" r="95"/>
      </clipPath>
    </defs>
    
    <rect width="1280" height="180" fill="#0D0D0D"/>
    <g class="fu">
      <text x="640" y="48" text-anchor="middle" class="mono" font-size="12" letter-spacing="6" fill="#C5A059">— I —</text>
      <text x="640" y="112" text-anchor="middle" class="serif" font-size="52" font-weight="700" fill="#F5F0E6">Prologue</text>
      
      <!-- Elegant Divider Lines with Diamonds -->
      <line x1="280" y1="96" x2="450" y2="96" stroke="url(#goldHorizontal)" stroke-width="1.2"/>
      <line x1="830" y1="96" x2="1000" y2="96" stroke="url(#goldHorizontal)" stroke-width="1.2"/>
      <rect x="274" y="93" width="6" height="6" transform="rotate(45 277 96)" fill="#F3D78F"/>
      <rect x="1000" y="93" width="6" height="6" transform="rotate(45 1003 96)" fill="#F3D78F"/>
      
      <text x="640" y="152" text-anchor="middle" class="mono" font-size="11" letter-spacing="4.5" fill="#A39B8B">THE ARCHITECT &amp; THE DISCIPLINE</text>
    </g>
</svg>