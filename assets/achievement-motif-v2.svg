<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-labelledby="ach-t ach-d">
  <title id="ach-t">Emad'adin Al-Ynaey — Verified Milestones and Impact</title>
  <desc id="ach-d">Founder &amp; Architect of ASAAS. 35+ enterprise solutions delivered, 50+ minds mentored, 12+ enterprise modules built.</desc>
  <defs>
    <linearGradient id="ach-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
    <radialGradient id="ach-glow-a" cx="80%" cy="40%" r="70%"><stop offset="0" stop-color="#701A3D" stop-opacity=".75"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <radialGradient id="ach-glow-b" cx="30%" cy="30%" r="70%"><stop offset="0" stop-color="#C77B9B" stop-opacity=".3"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient>
    <linearGradient id="ach-outline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5B5C7" stop-opacity=".18"/><stop offset="1" stop-color="#E5B5C7" stop-opacity=".02"/></linearGradient>
    <linearGradient id="ach-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ach-clip-a"><rect x="0" y="0" width="700" height="250" rx="16"/></clipPath>
    <clipPath id="ach-clip-b"><rect x="0" y="0" width="476" height="250" rx="16"/></clipPath>
    <linearGradient id="ach-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .ach-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .ach-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .ach-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .ach-in { animation: ach-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .35s; } .a3 { animation-delay: .6s; }
    .ach-draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: ach-draw 2.6s cubic-bezier(.65,0,.35,1) .8s forwards; }
    @keyframes ach-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes ach-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ach-in { animation: none; }
      .ach-draw { animation: none; stroke-dashoffset: 0; }
    }
    .ach-trace-a { stroke-dasharray: 340 1900; stroke-dashoffset: 2240; animation: ach-trace-a 6s linear infinite; }
    .ach-trace-b { stroke-dasharray: 260 1452; stroke-dashoffset: 1712; animation: ach-trace-b 6s linear -3s infinite; }
    @keyframes ach-trace-a { to { stroke-dashoffset: 0; } }
    @keyframes ach-trace-b { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .ach-trace-a, .ach-trace-b { display: none; } }
  </style>

  <rect width="1200" height="430" rx="20" fill="url(#ach-bg)"/>
  <rect x=".5" y=".5" width="1199" height="429" rx="19.5" fill="none" stroke="#C77B9B" stroke-opacity=".16"/>

  <!-- Card 1: ASAAS Founder & Architect -->
  <g class="ach-in a1"><g transform="translate(24 24)">
    <g clip-path="url(#ach-clip-a)">
      <rect width="700" height="250" fill="#190B12"/>
      <rect width="700" height="250" fill="url(#ach-glow-a)"/>
      <text class="ach-serif" x="684" y="124" text-anchor="end" font-size="110" font-weight="300" letter-spacing="-3" fill="url(#ach-outline)">ASAAS</text>
      <rect x="-300" y="0" width="260" height="250" fill="url(#ach-sheen)" transform="skewX(-18)">
        <animate attributeName="x" values="-300;900;900" keyTimes="0;.35;1" dur="9s" begin="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x=".5" y=".5" width="699" height="249" rx="15.5" fill="none" stroke="#C77B9B" stroke-opacity=".38"/>
    <rect class="ach-trace-a" x=".5" y=".5" width="699" height="249" rx="15.5" fill="none" stroke="url(#ach-trace)" stroke-width="1.8" stroke-linecap="round"/>
    <text class="ach-mono" x="36" y="150" font-size="12" letter-spacing="2.6" fill="#C77B9B">FOUNDER &amp; LEAD ARCHITECT · ENTERPRISE ERP</text>
    <text class="ach-serif" x="34" y="196" font-size="44" font-weight="300" letter-spacing="-1" fill="#F8F0F3">ASAAS Intelligent Platform</text>
    <text class="ach-sans" x="36" y="224" font-size="14" fill="#B6A3AC">Autonomous workflow orchestration &amp; multi-tenant business suites</text>
  </g></g>

  <!-- Card 2: 35+ Solutions Delivered -->
  <g class="ach-in a2"><g transform="translate(748 24)">
    <g clip-path="url(#ach-clip-b)">
      <rect width="428" height="250" fill="#190B12"/>
      <rect width="428" height="250" fill="url(#ach-glow-b)"/>
      <text class="ach-serif" x="420" y="132" text-anchor="end" font-size="130" font-style="italic" font-weight="300" letter-spacing="-6" fill="url(#ach-outline)">35+</text>
    </g>
    <rect x=".5" y=".5" width="427" height="249" rx="15.5" fill="none" stroke="#C77B9B" stroke-opacity=".3"/>
    <rect class="ach-trace-b" x=".5" y=".5" width="427" height="249" rx="15.5" fill="none" stroke="url(#ach-trace)" stroke-width="1.8" stroke-linecap="round"/>
    <text class="ach-mono" x="32" y="150" font-size="12" letter-spacing="2.6" fill="#C77B9B">ENTERPRISE DELIVERY</text>
    <text class="ach-serif" x="30" y="196" font-size="44" font-weight="300" letter-spacing="-1" fill="#F8F0F3">35+ Solutions</text>
    <text class="ach-sans" x="32" y="224" font-size="14" fill="#B6A3AC">Mission-critical AI pipelines &amp; backends</text>
  </g></g>

  <!-- Metric Strip (Bottom) -->
  <g class="ach-in a3"><g transform="translate(24 298)">
    <line x1="16" y1="0" x2="1136" y2="0" stroke="#C77B9B" stroke-opacity=".2"/>
    <g transform="translate(40 50)">
      <text class="ach-serif" font-size="38" font-weight="300" fill="#F8F0F3">50+</text>
      <text class="ach-sans" y="24" font-size="13" fill="#B6A3AC">Minds mentored &amp; trained</text>
    </g>
    <g transform="translate(340 50)">
      <text class="ach-serif" font-size="38" font-weight="300" fill="#F8F0F3">12+</text>
      <text class="ach-sans" y="24" font-size="13" fill="#B6A3AC">Enterprise ERP modules built</text>
    </g>
    <g transform="translate(640 50)">
      <text class="ach-serif" font-size="38" font-weight="300" fill="#F8F0F3">100%</text>
      <text class="ach-sans" y="24" font-size="13" fill="#B6A3AC">ACID transactional compliance</text>
    </g>
    <g transform="translate(940 50)">
      <text class="ach-serif" font-size="38" font-weight="300" fill="#F8F0F3">2026</text>
      <text class="ach-sans" y="24" font-size="13" fill="#B6A3AC">Yemen AI Summit contributor</text>
    </g>
  </g></g>
</svg>