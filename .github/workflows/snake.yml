name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake Contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: emadadin20
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#C5A059&color_dots=#0D0D0D,#241E14,#4A3A1B,#876625,#C5A059
            dist/snake-light.svg?color_snake=#9A7228&color_dots=#FAF6ED,#EADBBF,#D4B988,#B8934C,#9A7228

      - name: Push Snake Contribution SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
